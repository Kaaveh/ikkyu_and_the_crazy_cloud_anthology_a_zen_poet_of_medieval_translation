# fa-IR, not fa. Quarto's relative-path rewriter treats a bare `fa` as a path
# because a directory of that name exists, and emits lang="../fa" on every page
# under fa/. A region subtag sidesteps it, and pandoc still maps fa-IR to
# babel's `persian` for the PDF.
lang: fa-IR
dir: rtl

# Quarto has no built-in fa locale. Without this every piece of chrome renders
# in English inside a Persian book.
language: _language.yml

# Off deliberately. The poem number is already in the heading text -- fa/002.md
# opens with "# شعر ۷: ..." -- so Quarto's numbering would render it twice.
number-sections: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/rtl.css
    toc: true
    toc-depth: 2
    toc-title: "در این بخش"
    link-external-newwindow: true

  pdf:
    # LuaLaTeX, not XeLaTeX. See tex/preamble.tex -- under XeLaTeX pandoc picks
    # babel with bidi=default, which reverses Latin-script runs embedded in
    # Persian text, and this book's notes are full of them.
    pdf-engine: lualatex
    documentclass: book
    toc-depth: 1
    # openany: most poems are under a page, so openright would leave an empty
    # verso after each of 141 chapters.
    classoption: [openany]
    mainfont: "Vazirmatn-Regular.ttf"
    mainfontoptions:
      - Path=fonts/
      - BoldFont=Vazirmatn-Bold.ttf
      - Renderer=Harfbuzz
    fontsize: 12pt
    geometry:
      - top=25mm
      - bottom=25mm
      - inner=28mm
      - outer=22mm
    include-in-header: tex/preamble.tex
    colorlinks: true

  epub:
    # Pandoc supports this but does not derive it from `dir`, so an RTL book
    # otherwise ships with a left-to-right spine.
    page-progression-direction: rtl
    epub-fonts:
      - fonts/Vazirmatn-Regular.ttf
      - fonts/Vazirmatn-Bold.ttf
    css: assets/epub.css
    toc-depth: 1

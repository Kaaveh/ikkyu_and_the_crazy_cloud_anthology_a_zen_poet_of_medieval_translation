# Persian UI strings for Quarto.
#
# Quarto ships locales for about thirty languages; Persian is not one of them
# (there is _language-he.yml for Hebrew, but no fa). Without this file every
# piece of chrome falls back to English -- "Table of contents", "Chapter 2",
# "Edit this page" -- inside an otherwise Persian right-to-left book.
#
# Only the keys this book can actually render are translated. Quarto falls
# back to English for anything omitted, which is harmless for strings that
# never appear: theorem environments, listing pages, notebook links.
#
# If Quarto ever ships a real fa locale, delete this file and set `lang: fa`
# alone.

